name: Build AutoFish APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AutoFishAndroid_cloud_build.zip'
      - 'autofish-src/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o AutoFishAndroid_cloud_build.zip -d project

      - name: Install custom app icon
        run: |
          mkdir -p project/app/src/main/res/drawable
          cp autofish-src/app/src/main/res/drawable/ic_launcher.xml project/app/src/main/res/drawable/ic_launcher.xml
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path("project/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          if app is None:
              raise SystemExit("application element not found in AndroidManifest.xml")
          app.set(android + "icon", "@drawable/ic_launcher")
          app.set(android + "roundIcon", "@drawable/ic_launcher")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          print("Custom AutoFish launcher icon configured")
          PY

      - name: Add overlay permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path("project/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          permission = "android.permission.SYSTEM_ALERT_WINDOW"
          exists = any(node.tag == "uses-permission" and node.get(android + "name") == permission for node in root)
          if not exists:
              node = ET.Element("uses-permission")
              node.set(android + "name", permission)
              root.insert(0, node)
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          print("SYSTEM_ALERT_WINDOW permission is present")
          PY

      - name: Install OCR language models
        run: |
          mkdir -p project/app/src/main/assets/tessdata
          curl -L --fail --retry 3 https://github.com/tesseract-ocr/tessdata_fast/raw/refs/heads/main/rus.traineddata -o project/app/src/main/assets/tessdata/rus.traineddata
          curl -L --fail --retry 3 https://github.com/tesseract-ocr/tessdata_fast/raw/refs/heads/main/eng.traineddata -o project/app/src/main/assets/tessdata/eng.traineddata
          test -s project/app/src/main/assets/tessdata/rus.traineddata
          test -s project/app/src/main/assets/tessdata/eng.traineddata

      - name: Apply updated AutoFish source
        run: |
          mkdir -p project/app/src/main/java/com/example/autofish
          cp autofish-src/app/src/main/java/com/example/autofish/FishAccessibilityService.kt project/app/src/main/java/com/example/autofish/FishAccessibilityService.kt
          cp autofish-src/app/src/main/java/com/example/autofish/MainActivity.kt project/app/src/main/java/com/example/autofish/MainActivity.kt
          sed -i 's/it.recycle()/it.end()/g; s/tess?.recycle()/tess?.end()/g' project/app/src/main/java/com/example/autofish/FishAccessibilityService.kt

      - name: Configure Kotlin and OCR dependency
        run: |
          cd project
          sed -i '/com.google.mlkit:text-recognition/d' app/build.gradle.kts
          echo 'dependencies { implementation("com.rmtheis:tess-two:9.1.0") }' >> app/build.gradle.kts
          echo 'tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach { kotlinOptions.jvmTarget = "1.8" }' >> app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd project
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoFish-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
