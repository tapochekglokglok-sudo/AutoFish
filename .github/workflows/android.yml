
name: Build AutoFish APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AutoFishAndroid_cloud_build.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o AutoFishAndroid_cloud_build.zip -d project

      - name: Apply updated AutoFish service
        run: |
          mkdir -p project/app/src/main/java/com/example/autofish
          cp autofish-src/app/src/main/java/com/example/autofish/FishAccessibilityService.kt project/app/src/main/java/com/example/autofish/FishAccessibilityService.kt

      - name: Inspect app source
        run: |
          echo '===== MainActivity.kt ====='
          cat project/app/src/main/java/com/example/autofish/MainActivity.kt
          echo '===== FishAccessibilityService.kt ====='
          cat project/app/src/main/java/com/example/autofish/FishAccessibilityService.kt 2>/dev/null || true
          echo '===== FishAccessibilityService.kt candidates ====='
          find project/app/src/main -type f | sort

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          cd project
          sed -i 's/textSize=16/textSize=16f/; s/textSize=26/textSize=26f/' app/src/main/java/com/example/autofish/MainActivity.kt
          echo 'tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach { kotlinOptions.jvmTarget = "1.8" }' >> app/build.gradle.kts
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoFish-APK
          path: project/**/build/outputs/apk/debug/*.apk
