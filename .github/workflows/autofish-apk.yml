name: Build AutoFish APK

on:
  workflow_dispatch:
  push:
    paths:
      - "autofish-clean-start/**"
      - ".github/workflows/autofish-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle -p autofish-clean-start :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoFish-debug-apk
          path: autofish-clean-start/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
